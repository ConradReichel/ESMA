services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: esma
      POSTGRES_USER: esma
      POSTGRES_PASSWORD: esma-local-only
    ports:
      - "5432:5432"
    volumes:
      - esma_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esma -d esma"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  esma_pgdata:

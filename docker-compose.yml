services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: esma
      POSTGRES_USER: ${POSTGRES_USER:-esma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-keycloak.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d esma"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: esma
      PGUSER: ${POSTGRES_USER:-esma}
      POSTGRES_USER: ${POSTGRES_USER:-esma}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/schema.sql:/schema.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql -v ON_ERROR_STOP=1 -f /schema.sql"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: esma_keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-esma}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${AUTH_DOMAIN:-auth.localhost}
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/esma-realm.json:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-esma}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: esma
      PGSSLMODE: disable
      OIDC_ISSUER: https://${AUTH_DOMAIN:-auth.localhost}/realms/esma
      OIDC_JWKS_URL: http://keycloak:8080/realms/esma/protocol/openid-connect/certs
      OIDC_AUDIENCE: esma-api
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_STORAGE_PATH: /data/images
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-chicken-images}
      PUBLIC_APP_URL: https://${APP_DOMAIN:-localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      WIX_API_KEY: ${WIX_API_KEY:-}
    volumes:
      - image_data:/data/images
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      OIDC_URL: https://${AUTH_DOMAIN:-auth.localhost}
      OIDC_REALM: esma
      OIDC_CLIENT_ID: esma-web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      keycloak:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  image_data:
  caddy_data:
  caddy_config:
